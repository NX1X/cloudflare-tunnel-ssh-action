<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2740A"/>
      <stop offset="1" stop-color="#E25305"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- subtle border frame -->
  <rect x="20" y="20" width="1240" height="600" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- shield icon -->
  <g transform="translate(120, 200) scale(10)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
  </g>

  <!-- title -->
  <text x="400" y="262" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="700">Cloudflare Tunnel</text>
  <text x="400" y="346" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="700">SSH Action</text>

  <!-- tagline -->
  <text x="402" y="408" fill="#ffffff" fill-opacity="0.92" font-family="Segoe UI, Arial, sans-serif" font-size="34">Zero-trust CI/CD SSH access - no exposed port 22.</text>

  <!-- command chip -->
  <rect x="402" y="446" width="640" height="60" rx="12" fill="#ffffff" fill-opacity="0.14"/>
  <text x="426" y="484" fill="#ffffff" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="600">uses: NX1X/cloudflare-tunnel-ssh-action@v1</text>

  <!-- footer -->
  <text x="120" y="582" fill="#ffffff" fill-opacity="0.80" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">NXTOOLS COLLECTION</text>
  <text x="1160" y="582" text-anchor="end" fill="#ffffff" fill-opacity="0.80" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">github.com/NX1X</text>
</svg>
