name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal workflow YAML or steps to reproduce the behavior.
      placeholder: |
        1. Used the action with these inputs: ...
        2. Ran `ssh ...`
        3. Got error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (include error output if any).
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Action Version
      description: "Which version of the action are you using? (e.g. v1, v1.0.0)"
      placeholder: "v1"
    validations:
      required: true

  - type: dropdown
    id: runner
    attributes:
      label: Runner OS
      options:
        - ubuntu-latest (Ubuntu 24.04)
        - ubuntu-22.04
        - ubuntu-20.04
        - Other
    validations:
      required: true

  - type: input
    id: cloudflared-version
    attributes:
      label: cloudflared Version
      description: "Output of `cloudflared --version`, or 'latest' if using the default"
      placeholder: "latest"

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, logs, or screenshots. Redact any secrets or credentials.
