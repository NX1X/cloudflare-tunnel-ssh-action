      # =======================================================================
      # 16. connect-timeout and server-alive-interval validation tests
      # =======================================================================
      - name: 'Test: connect-timeout and server-alive-interval validation'
        shell: bash
        run: |
          source /tmp/test-helpers.sh
          echo "=== Timeout validation tests ==="

          validate_timeout() {
            local val="$1"
            if ! echo "$val" | grep -qE '^[0-9]+$'; then
              return 1
            fi
            return 0
          }

          # Valid values (including 0 — differs from retry-count which rejects 0)
          validate_timeout "0"
          assert_equals "0 is valid" "0" "$?"
          validate_timeout "30"
          assert_equals "30 is valid" "0" "$?"
          validate_timeout "120"
          assert_equals "120 is valid" "0" "$?"
          validate_timeout "9999"
          assert_equals "9999 is valid" "0" "$?"

          # Invalid values
          assert_command_fails "empty string rejected" validate_timeout ""
          assert_command_fails "negative rejected" validate_timeout "-1"
          assert_command_fails "decimal rejected" validate_timeout "3.5"
          assert_command_fails "text rejected" validate_timeout "abc"
          assert_command_fails "spaces rejected" validate_timeout "1 2"
          assert_command_fails "mixed rejected" validate_timeout "30s"

          # Verify values flow into SSH config correctly
          rm -f ~/.ssh/config
          CONNECT_TIMEOUT="45"
          SERVER_ALIVE_INTERVAL="10"
          {
            printf 'Host test.example.com\n'
            printf '  ConnectTimeout %s\n' "$CONNECT_TIMEOUT"
            printf '  ServerAliveInterval %s\n' "$SERVER_ALIVE_INTERVAL"
          } > ~/.ssh/config

          CONFIG=$(cat ~/.ssh/config)
          assert_contains "ConnectTimeout 45 in config" "$CONFIG" "ConnectTimeout 45"
          assert_contains "ServerAliveInterval 10 in config" "$CONFIG" "ServerAliveInterval 10"

          rm -f ~/.ssh/config
          finish_tests

      # =======================================================================
      # 17. Cleanup awk Host block removal tests
      # =======================================================================
      - name: 'Test: cleanup awk Host block removal'
        shell: bash
        run: |
          source /tmp/test-helpers.sh
          echo "=== Cleanup awk tests ==="

          # Helper: run the awk script from cleanup/action.yml
          remove_host() {
            local host="$1" input="$2" output="$3"
            awk -v host="$host" '
              /^Host / { if ($2 == host) { skip=1; next } else { skip=0 } }
              skip && /^[[:space:]]/ { next }
              skip { skip=0 }
              { print }
            ' "$input" > "$output"
          }

          # --- Test 1: Remove middle host ---
          cat > /tmp/awk-input << 'EOF'
          Host keep-before.example.com
            User alice
            ConnectTimeout 30
          Host target.example.com
            User deploy
            StrictHostKeyChecking accept-new
            ProxyCommand ~/.cloudflared-ssh --hostname %h
          Host keep-after.example.com
            User bob
            ConnectTimeout 60
          EOF
          # Remove leading indentation from heredoc
          sed -i 's/^          //' /tmp/awk-input

          remove_host "target.example.com" /tmp/awk-input /tmp/awk-output
          RESULT=$(cat /tmp/awk-output)
          assert_not_contains "target removed" "$RESULT" "Host target.example.com"
          assert_not_contains "target directives removed" "$RESULT" "ProxyCommand"
          assert_contains "before preserved" "$RESULT" "Host keep-before.example.com"
          assert_contains "before user preserved" "$RESULT" "User alice"
          assert_contains "after preserved" "$RESULT" "Host keep-after.example.com"
          assert_contains "after user preserved" "$RESULT" "User bob"

          # --- Test 2: Remove first host ---
          remove_host "keep-before.example.com" /tmp/awk-input /tmp/awk-output
          RESULT=$(cat /tmp/awk-output)
          assert_not_contains "first host removed" "$RESULT" "keep-before.example.com"
          assert_contains "middle still present" "$RESULT" "Host target.example.com"
          assert_contains "last still present" "$RESULT" "Host keep-after.example.com"

          # --- Test 3: Remove last host ---
          remove_host "keep-after.example.com" /tmp/awk-input /tmp/awk-output
          RESULT=$(cat /tmp/awk-output)
          assert_not_contains "last host removed" "$RESULT" "keep-after.example.com"
          assert_contains "first still present" "$RESULT" "Host keep-before.example.com"
          assert_contains "middle still present" "$RESULT" "Host target.example.com"

          # --- Test 4: Nonexistent host (no-op) ---
          remove_host "nonexistent.example.com" /tmp/awk-input /tmp/awk-output
          HOST_COUNT_BEFORE=$(grep -c '^Host ' /tmp/awk-input)
          HOST_COUNT_AFTER=$(grep -c '^Host ' /tmp/awk-output)
          assert_equals "no-op preserves all hosts" "$HOST_COUNT_BEFORE" "$HOST_COUNT_AFTER"

          # --- Test 5: Adjacent blocks with no blank line ---
          cat > /tmp/awk-adjacent << 'EOF'
          Host first.example.com
            User alice
          Host second.example.com
            User bob
          EOF
          sed -i 's/^          //' /tmp/awk-adjacent

          remove_host "first.example.com" /tmp/awk-adjacent /tmp/awk-output
          RESULT=$(cat /tmp/awk-output)
          assert_not_contains "adjacent first removed" "$RESULT" "first.example.com"
          assert_contains "adjacent second intact" "$RESULT" "Host second.example.com"
          assert_contains "adjacent second user intact" "$RESULT" "User bob"

          rm -f /tmp/awk-input /tmp/awk-output /tmp/awk-adjacent
          finish_tests

      # =======================================================================
      # 18. Retry loop behavior tests
      # =======================================================================
      - name: 'Test: retry loop behavior'
        shell: bash
        run: |
          source /tmp/test-helpers.sh
          echo "=== Retry loop tests ==="

          COUNTER_FILE="/tmp/retry-counter"

          # --- Test 1: Succeeds on first attempt ---
          echo "0" > "$COUNTER_FILE"
          cat > /tmp/mock-ssh << 'MOCK'
          #!/bin/bash
          COUNT=$(cat /tmp/retry-counter)
          COUNT=$((COUNT + 1))
          echo "$COUNT" > /tmp/retry-counter
          exit 0
          MOCK
          sed -i 's/^          //' /tmp/mock-ssh
          chmod +x /tmp/mock-ssh

          RETRY_COUNT=3
          RETRY_DELAY=0
          ATTEMPT=1
          HOST_OK=false
          while [ "$ATTEMPT" -le "$RETRY_COUNT" ]; do
            if /tmp/mock-ssh; then
              HOST_OK=true
              break
            fi
            if [ "$ATTEMPT" -lt "$RETRY_COUNT" ]; then
              sleep "$RETRY_DELAY"
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          assert_equals "first-attempt success" "true" "$HOST_OK"
          assert_equals "only 1 attempt made" "1" "$(cat $COUNTER_FILE)"

          # --- Test 2: Fails twice, succeeds on third ---
          echo "0" > "$COUNTER_FILE"
          cat > /tmp/mock-ssh << 'MOCK'
          #!/bin/bash
          COUNT=$(cat /tmp/retry-counter)
          COUNT=$((COUNT + 1))
          echo "$COUNT" > /tmp/retry-counter
          if [ "$COUNT" -lt 3 ]; then exit 1; else exit 0; fi
          MOCK
          sed -i 's/^          //' /tmp/mock-ssh
          chmod +x /tmp/mock-ssh

          ATTEMPT=1
          HOST_OK=false
          while [ "$ATTEMPT" -le "$RETRY_COUNT" ]; do
            if /tmp/mock-ssh; then
              HOST_OK=true
              break
            fi
            if [ "$ATTEMPT" -lt "$RETRY_COUNT" ]; then
              sleep "$RETRY_DELAY"
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          assert_equals "third-attempt success" "true" "$HOST_OK"
          assert_equals "3 attempts made" "3" "$(cat $COUNTER_FILE)"

          # --- Test 3: Exhausts all retries ---
          echo "0" > "$COUNTER_FILE"
          cat > /tmp/mock-ssh << 'MOCK'
          #!/bin/bash
          COUNT=$(cat /tmp/retry-counter)
          COUNT=$((COUNT + 1))
          echo "$COUNT" > /tmp/retry-counter
          exit 1
          MOCK
          sed -i 's/^          //' /tmp/mock-ssh
          chmod +x /tmp/mock-ssh

          ATTEMPT=1
          HOST_OK=false
          while [ "$ATTEMPT" -le "$RETRY_COUNT" ]; do
            if /tmp/mock-ssh; then
              HOST_OK=true
              break
            fi
            if [ "$ATTEMPT" -lt "$RETRY_COUNT" ]; then
              sleep "$RETRY_DELAY"
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          assert_equals "exhausted retries" "false" "$HOST_OK"
          assert_equals "exactly 3 attempts" "3" "$(cat $COUNTER_FILE)"

          # --- Test 4: Single retry ---
          echo "0" > "$COUNTER_FILE"
          RETRY_COUNT=1
          ATTEMPT=1
          HOST_OK=false
          while [ "$ATTEMPT" -le "$RETRY_COUNT" ]; do
            if /tmp/mock-ssh; then
              HOST_OK=true
              break
            fi
            if [ "$ATTEMPT" -lt "$RETRY_COUNT" ]; then
              sleep "$RETRY_DELAY"
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          assert_equals "single retry fails" "false" "$HOST_OK"
          assert_equals "exactly 1 attempt" "1" "$(cat $COUNTER_FILE)"

          # --- Test 5: ALL_PASSED with mixed results ---
          ALL_PASSED=true
          # Host 1: always succeeds
          cat > /tmp/mock-ssh << 'MOCK'
          #!/bin/bash
          exit 0
          MOCK
          sed -i 's/^          //' /tmp/mock-ssh
          chmod +x /tmp/mock-ssh

          HOST_OK=false
          if /tmp/mock-ssh; then HOST_OK=true; fi
          if [ "$HOST_OK" = false ]; then ALL_PASSED=false; fi

          # Host 2: always fails
          cat > /tmp/mock-ssh << 'MOCK'
          #!/bin/bash
          exit 1
          MOCK
          sed -i 's/^          //' /tmp/mock-ssh
          chmod +x /tmp/mock-ssh

          HOST_OK=false
          RETRY_COUNT=1
          ATTEMPT=1
          while [ "$ATTEMPT" -le "$RETRY_COUNT" ]; do
            if /tmp/mock-ssh; then HOST_OK=true; break; fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          if [ "$HOST_OK" = false ]; then ALL_PASSED=false; fi

          assert_equals "ALL_PASSED false with mixed results" "false" "$ALL_PASSED"

          rm -f /tmp/mock-ssh "$COUNTER_FILE"
          finish_tests

