      # =======================================================================
      # 13. Custom SSH config directives tests
      # =======================================================================
      - name: 'Test: custom SSH config directives'
        shell: bash
        run: |
          source /tmp/test-helpers.sh
          echo "=== Custom SSH config tests ==="

          rm -f ~/.ssh/config

          SSH_EXTRA_CONFIG="ForwardAgent yes
          LogLevel DEBUG
          Ciphers aes256-gcm@openssh.com"

          {
            printf 'Host extra.example.com\n'
            printf '  User deploy\n'
            printf '  StrictHostKeyChecking no\n'
            printf '  ConnectTimeout 120\n'
            printf '  ServerAliveInterval 30\n'
            printf '  ServerAliveCountMax 4\n'
            printf '  ProxyCommand ~/.cloudflared-ssh --hostname %%h\n'
            if [ -n "$SSH_EXTRA_CONFIG" ]; then
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                printf '  %s\n' "$line"
              done <<< "$SSH_EXTRA_CONFIG"
            fi
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config

          CONFIG=$(cat ~/.ssh/config)

          assert_contains "ForwardAgent present" "$CONFIG" "ForwardAgent yes"
          assert_contains "LogLevel present" "$CONFIG" "LogLevel DEBUG"
          assert_contains "Ciphers present" "$CONFIG" "Ciphers aes256-gcm@openssh.com"

          # Verify extra config is indented (inside the Host block)
          INDENTED=$(grep '  ForwardAgent yes' ~/.ssh/config)
          TESTS=$((TESTS + 1))
          if [ -n "$INDENTED" ]; then
            echo "  PASS: extra config is indented"
          else
            echo "  FAIL: extra config not indented"
            FAILURES=$((FAILURES + 1))
          fi

          finish_tests

