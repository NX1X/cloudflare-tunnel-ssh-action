      # =======================================================================
      # 21. Idempotency of SSH config generation tests
      # =======================================================================
      - name: 'Test: idempotency of SSH config generation'
        shell: bash
        run: |
          source /tmp/test-helpers.sh
          echo "=== Idempotency tests ==="

          rm -f ~/.ssh/config

          generate_config() {
            {
              printf 'Host idempotent.example.com\n'
              printf '  User deploy\n'
              printf '  StrictHostKeyChecking accept-new\n'
              printf '  ConnectTimeout 120\n'
              printf '  ProxyCommand ~/.cloudflared-ssh --hostname %%h\n'
            } >> ~/.ssh/config
          }

          generate_config
          generate_config

          HOST_COUNT=$(grep -c '^Host idempotent.example.com' ~/.ssh/config)
          assert_equals "duplicate blocks created on re-run" "2" "$HOST_COUNT"

          # Verify cleanup awk removes ALL duplicates
          awk -v host="idempotent.example.com" '
            /^Host / { if ($2 == host) { skip=1; next } else { skip=0 } }
            skip && /^[[:space:]]/ { next }
            skip { skip=0 }
            { print }
          ' ~/.ssh/config > /tmp/idem-result

          REMAINING=$(grep -c '^Host' /tmp/idem-result || true)
          assert_equals "awk removes all duplicates" "0" "$REMAINING"

          rm -f ~/.ssh/config /tmp/idem-result
          finish_tests

      # =======================================================================
      # 22. Edge case hostname parsing tests
      # =======================================================================
      - name: 'Test: edge case hostname parsing'
        shell: bash
        run: |
          source /tmp/test-helpers.sh
          echo "=== Edge case hostname tests ==="

          parse_entry() {
            local entry="$1" SSH_USER="$2"
            local ENTRY_USER ENTRY_HOST
            if [[ "$entry" == *@* ]]; then
              ENTRY_USER="${entry%%@*}"
              ENTRY_HOST="${entry#*@}"
            else
              ENTRY_USER="$SSH_USER"
              ENTRY_HOST="$entry"
            fi
            echo "USER=${ENTRY_USER} HOST=${ENTRY_HOST}"
          }

          # Normal cases
          RESULT=$(parse_entry "admin@web.example.com" "deploy")
          assert_contains "user@host: user" "$RESULT" "USER=admin"
          assert_contains "user@host: host" "$RESULT" "HOST=web.example.com"

          RESULT=$(parse_entry "bare.example.com" "deploy")
          assert_contains "bare: default user" "$RESULT" "USER=deploy"
          assert_contains "bare: host" "$RESULT" "HOST=bare.example.com"

          # Malformed: @host (empty user)
          RESULT=$(parse_entry "@orphan.example.com" "deploy")
          assert_contains "@host: empty user" "$RESULT" "USER= "
          assert_contains "@host: host parsed" "$RESULT" "HOST=orphan.example.com"

          # Malformed: user@ (empty host)
          RESULT=$(parse_entry "admin@" "deploy")
          assert_contains "user@: user parsed" "$RESULT" "USER=admin"
          # HOST= is at end of string
          TESTS=$((TESTS + 1))
          if echo "$RESULT" | grep -q 'HOST=$'; then
            echo "  PASS: user@: empty host"
          else
            echo "  FAIL: user@: host should be empty (got: $RESULT)"
            FAILURES=$((FAILURES + 1))
          fi

          # Malformed: just @
          RESULT=$(parse_entry "@" "deploy")
          TESTS=$((TESTS + 1))
          if echo "$RESULT" | grep -q 'USER= HOST=$'; then
            echo "  PASS: @: both empty"
          else
            echo "  FAIL: @: expected empty user and host (got: $RESULT)"
            FAILURES=$((FAILURES + 1))
          fi

          # IPv6-style hostname
          RESULT=$(parse_entry "root@[::1]" "deploy")
          assert_contains "IPv6: user" "$RESULT" "USER=root"
          assert_contains "IPv6: host" "$RESULT" "HOST=[::1]"

          # Multiple @ signs
          RESULT=$(parse_entry "user@host@domain.com" "deploy")
          assert_contains "multi@: first segment as user" "$RESULT" "USER=user"
          assert_contains "multi@: rest as host" "$RESULT" "HOST=host@domain.com"

          # Host with port-like suffix
          RESULT=$(parse_entry "deploy@host.example.com:2222" "deploy")
          assert_contains "host:port: host includes port" "$RESULT" "HOST=host.example.com:2222"

          finish_tests

      # =======================================================================
      # 23. ssh-extra-config boundary cases tests
      # =======================================================================
      - name: 'Test: ssh-extra-config boundary cases'
        shell: bash
        run: |
          source /tmp/test-helpers.sh
          echo "=== Extra config boundary tests ==="

          generate_with_extra() {
            local SSH_EXTRA_CONFIG="$1"
            rm -f ~/.ssh/config
            {
              printf 'Host test.example.com\n'
              printf '  User deploy\n'
              printf '  ConnectTimeout 120\n'
              if [ -n "$SSH_EXTRA_CONFIG" ]; then
                while IFS= read -r line; do
                  [ -z "$line" ] && continue
                  printf '  %s\n' "$line"
                done <<< "$SSH_EXTRA_CONFIG"
              fi
            } > ~/.ssh/config
          }

          # --- Test 1: Empty lines skipped ---
          EXTRA="ForwardAgent yes

          LogLevel DEBUG"
          generate_with_extra "$EXTRA"
          CONFIG=$(cat ~/.ssh/config)
          DIRECTIVE_COUNT=$(grep -c '  ForwardAgent\|  LogLevel' ~/.ssh/config)
          assert_equals "two directives, blank skipped" "2" "$DIRECTIVE_COUNT"
          BLANK_INDENTED=$(grep -c '^  $' ~/.ssh/config || true)
          assert_equals "no blank indented lines" "0" "$BLANK_INDENTED"

          # --- Test 2: Single directive ---
          generate_with_extra "ForwardAgent yes"
          CONFIG=$(cat ~/.ssh/config)
          assert_contains "single directive works" "$CONFIG" "ForwardAgent yes"

          # --- Test 3: Match all injection (documents behavior) ---
          EXTRA="Match all
          ForwardAgent yes"
          generate_with_extra "$EXTRA"
          CONFIG=$(cat ~/.ssh/config)
          assert_contains "Match all is written" "$CONFIG" "Match all"
          assert_contains "ForwardAgent after Match" "$CONFIG" "ForwardAgent yes"

          # --- Test 4: Extra config applied to all hosts in multi-host ---
          rm -f ~/.ssh/config
          SSH_EXTRA_CONFIG="ForwardAgent yes"
          for host in h1.example.com h2.example.com; do
            {
              printf 'Host %s\n' "$host"
              printf '  User deploy\n'
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                printf '  %s\n' "$line"
              done <<< "$SSH_EXTRA_CONFIG"
            } >> ~/.ssh/config
          done

          FA_COUNT=$(grep -c 'ForwardAgent yes' ~/.ssh/config)
          assert_equals "extra config applied to both hosts" "2" "$FA_COUNT"

          rm -f ~/.ssh/config
          finish_tests

      # =======================================================================
      # 24. Duplicate hosts in input tests
      # =======================================================================
      - name: 'Test: duplicate hosts in input'
        shell: bash
        run: |
          source /tmp/test-helpers.sh
          echo "=== Duplicate host tests ==="

          rm -f ~/.ssh/config

          # --- Same host twice ---
          SSH_HOST="web.example.com web.example.com"
          SSH_USER="deploy"
          HOST_LIST=$(echo "$SSH_HOST" | tr '\n' ' ')
          set -f
          # shellcheck disable=SC2086
          for entry in $HOST_LIST; do
            [ -z "$entry" ] && continue
            printf 'Host %s\n  User %s\n  ProxyCommand ~/.cloudflared-ssh --hostname %%h\n' "$entry" "$SSH_USER" >> ~/.ssh/config
          done
          set +f

          HOST_COUNT=$(grep -c '^Host web.example.com' ~/.ssh/config)
          assert_equals "duplicate creates two blocks" "2" "$HOST_COUNT"

          # Cleanup awk removes both
          awk -v host="web.example.com" '
            /^Host / { if ($2 == host) { skip=1; next } else { skip=0 } }
            skip && /^[[:space:]]/ { next }
            skip { skip=0 }
            { print }
          ' ~/.ssh/config > /tmp/dup-result
          REMAINING=$(grep -c '^Host' /tmp/dup-result || true)
          assert_equals "awk removes all duplicates" "0" "$REMAINING"

          # --- Same host, different users ---
          rm -f ~/.ssh/config
          SSH_HOST="admin@web.example.com deploy@web.example.com"
          HOST_LIST=$(echo "$SSH_HOST" | tr '\n' ' ')
          set -f
          # shellcheck disable=SC2086
          for entry in $HOST_LIST; do
            [ -z "$entry" ] && continue
            if [[ "$entry" == *@* ]]; then
              ENTRY_USER="${entry%%@*}"
              ENTRY_HOST="${entry#*@}"
            else
              ENTRY_USER="$SSH_USER"
              ENTRY_HOST="$entry"
            fi
            printf 'Host %s\n  User %s\n' "$ENTRY_HOST" "$ENTRY_USER" >> ~/.ssh/config
          done
          set +f

          HOST_COUNT=$(grep -c '^Host web.example.com' ~/.ssh/config)
          assert_equals "same host different users: two blocks" "2" "$HOST_COUNT"
          assert_contains "admin user present" "$(cat ~/.ssh/config)" "User admin"
          assert_contains "deploy user present" "$(cat ~/.ssh/config)" "User deploy"

          rm -f ~/.ssh/config /tmp/dup-result
          finish_tests

      # =======================================================================
      # 25. action.yml logic consistency check (drift guard)
      # =======================================================================
      - name: 'Test: action.yml logic consistency check'
        shell: bash
        run: |
          source /tmp/test-helpers.sh
          echo "=== Logic consistency tests ==="

          ACTION_FILE="action.yml"
          CLEANUP_FILE="cleanup/action.yml"

          # --- Verify connect-timeout validation regex ---
          CT_LINE=$(grep 'CONNECT_TIMEOUT.*grep' "$ACTION_FILE" | head -1)
          assert_contains "connect-timeout uses ^[0-9]+$ regex" "$CT_LINE" "'^[0-9]"

          # --- Verify retry-count validation regex ---
          RC_LINE=$(grep 'RETRY_COUNT.*grep' "$ACTION_FILE" | head -1)
          assert_contains "retry-count uses ^[1-9] regex" "$RC_LINE" "'^[1-9]"

          # --- Verify set -f is present ---
          SETF_COUNT=$(grep -c 'set -f' "$ACTION_FILE")
          TESTS=$((TESTS + 1))
          if [ "$SETF_COUNT" -ge 2 ]; then
            echo "  PASS: set -f appears $SETF_COUNT times in action.yml"
          else
            echo "  FAIL: expected set -f at least 2 times, found $SETF_COUNT"
            FAILURES=$((FAILURES + 1))
          fi

          # --- Verify set +f balances set -f ---
          SETPF_COUNT=$(grep -c 'set +f' "$ACTION_FILE")
          assert_equals "set +f balances set -f" "$SETF_COUNT" "$SETPF_COUNT"

          # --- Verify cleanup awk pattern ---
          AWK_LINE=$(grep 'awk -v host=' "$CLEANUP_FILE")
          assert_contains "cleanup uses awk -v host=" "$AWK_LINE" "awk -v host="

          # --- Verify KNOWN_HOSTS_CREATED flag in both files ---
          KH_WRITE=$(grep 'KNOWN_HOSTS_CREATED=true' "$ACTION_FILE")
          assert_contains "action writes KNOWN_HOSTS_CREATED" "$KH_WRITE" "KNOWN_HOSTS_CREATED=true"
          KH_READ=$(grep 'KNOWN_HOSTS_CREATED' "$CLEANUP_FILE")
          assert_contains "cleanup reads KNOWN_HOSTS_CREATED" "$KH_READ" "KNOWN_HOSTS_CREATED"

          # --- Verify user@host parsing uses consistent operators ---
          # shellcheck disable=SC2016
          PARSE_USER=$(grep 'entry%%@' "$ACTION_FILE" | head -1)
          # shellcheck disable=SC2016
          assert_contains "user parsing uses %%@*" "$PARSE_USER" '${entry%%@*}'
          # shellcheck disable=SC2016
          PARSE_HOST=$(grep 'entry#\*@' "$ACTION_FILE" | head -1)
          # shellcheck disable=SC2016
          assert_contains "host parsing uses #*@" "$PARSE_HOST" '${entry#*@}'

          # --- Verify wrapper run: block uses TUNNEL_ env vars, not CF_ACCESS_ ---
          # Only check the run: block content (after 'run: |'), not YAML comments
          WRAPPER_RUN=$(sed -n '/Create cloudflared wrapper/,/chmod 700/{/run: |/,/chmod 700/p}' "$ACTION_FILE")
          assert_contains "uses TUNNEL_SERVICE_TOKEN_ID" "$WRAPPER_RUN" "TUNNEL_SERVICE_TOKEN_ID"
          assert_contains "uses TUNNEL_SERVICE_TOKEN_SECRET" "$WRAPPER_RUN" "TUNNEL_SERVICE_TOKEN_SECRET"
          assert_not_contains "no CF_ACCESS_CLIENT_ID in run block" "$WRAPPER_RUN" "CF_ACCESS_CLIENT_ID"

          # --- Verify all inputs are passed through env: blocks ---
          # Count env: blocks with 'inputs.' references (should match all run: steps that use inputs)
          ENV_INPUT_COUNT=$(grep -c 'inputs\.' "$ACTION_FILE" | head -1 || true)
          TESTS=$((TESTS + 1))
          if [ "$ENV_INPUT_COUNT" -gt 0 ]; then
            echo "  PASS: found $ENV_INPUT_COUNT input references in action.yml"
          else
            echo "  FAIL: no input references found"
            FAILURES=$((FAILURES + 1))
          fi

          # --- Verify grep -F in verify step ---
          VERIFY_GREP=$(grep 'grep -F' "$ACTION_FILE")
          assert_contains "verify step uses grep -F" "$VERIFY_GREP" "grep -F"

          finish_tests
