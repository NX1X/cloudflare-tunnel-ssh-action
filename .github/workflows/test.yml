name: Test Action

# =============================================================================
# Manual smoke-test for cloudflare-tunnel-ssh-action.
# Requires a real Cloudflare Tunnel and SSH server.
#
# Required secrets (set in repository settings):
#   CF_ACCESS_CLIENT_ID      - service token Client ID
#   CF_ACCESS_CLIENT_SECRET  - service token Client Secret
#   SSH_PRIVATE_KEY          - Ed25519 private key
#   SERVER_SSH_HOST          - tunnel SSH hostname (e.g. ssh.example.com)
#   DEPLOY_USER              - SSH username
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      cloudflared-version:
        description: 'cloudflared version to test (leave blank for latest)'
        required: false
        default: 'latest'
      test-connection:
        description: 'Run SSH connection test'
        required: false
        default: true
        type: boolean
      retry-count:
        description: 'Connection retry attempts'
        required: false
        default: '3'
      retry-delay:
        description: 'Seconds between retries'
        required: false
        default: '5'
      ssh-extra-config:
        description: 'Extra SSH config (e.g. "LogLevel DEBUG")'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Cloudflare Tunnel SSH
        id: setup-ssh
        uses: ./
        with:
          cf-access-client-id:     ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ssh-private-key:         ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-host:                ${{ secrets.SERVER_SSH_HOST }}
          ssh-user:                ${{ secrets.DEPLOY_USER }}
          cloudflared-version:     ${{ inputs.cloudflared-version }}
          test-connection:         ${{ inputs.test-connection }}
          retry-count:             ${{ inputs.retry-count }}
          retry-delay:             ${{ inputs.retry-delay }}
          ssh-extra-config:        ${{ inputs.ssh-extra-config }}

      - name: Verify outputs
        env:
          CF_VERSION: ${{ steps.setup-ssh.outputs.cloudflared-version }}
          TEST_RESULT: ${{ steps.setup-ssh.outputs.connection-test-result }}
        run: |
          echo "cloudflared-version: $CF_VERSION"
          echo "connection-test-result: $TEST_RESULT"
          [ -n "$CF_VERSION" ] || { echo "FAIL: version output empty"; exit 1; }

      - name: Run a remote command
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SERVER_HOST: ${{ secrets.SERVER_SSH_HOST }}
        run: |
          ssh "${DEPLOY_USER}@${SERVER_HOST}" "echo 'Remote command OK' && whoami && uptime"

      - name: Cleanup
        uses: ./cleanup
        if: always()

      - name: Verify cleanup
        if: always()
        run: |
          [ ! -f ~/.cloudflared-ssh ] || { echo "FAIL: wrapper not removed"; exit 1; }
          [ ! -f ~/.cloudflared-ssh-state ] || { echo "FAIL: state not removed"; exit 1; }
          echo "Cleanup verified"
