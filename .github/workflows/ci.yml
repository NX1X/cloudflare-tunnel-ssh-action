name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION="1.7.7"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          tar xzf /tmp/actionlint.tar.gz -C /tmp
          sudo mv /tmp/actionlint /usr/local/bin/

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run actionlint (validates action YAML + shell scripts)
        run: actionlint

      - name: Validate action.yml structure
        run: |
          echo "=== Checking required files ==="
          for f in action.yml README.md LICENSE CHANGELOG.md; do
            if [ -f "$f" ]; then
              echo "  ok $f"
            else
              echo "  MISSING $f"
              exit 1
            fi
          done

          echo ""
          echo "=== Checking action.yml has required fields ==="
          failed=0
          for field in name description author runs; do
            if grep -q "^${field}:" action.yml; then
              echo "  ok ${field}"
            else
              echo "  MISSING ${field}"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi

          echo ""
          echo "=== Checking wrapper script uses correct env var names ==="
          for var in TUNNEL_SERVICE_TOKEN_ID TUNNEL_SERVICE_TOKEN_SECRET; do
            if grep -q "$var" action.yml; then
              echo "  ok ${var} present"
            else
              echo "  MISSING ${var}"
              exit 1
            fi
          done
          if grep -q "CF_ACCESS_CLIENT_ID" action.yml; then
            echo "  WARN CF_ACCESS_CLIENT_ID found - verify it is not used as a cloudflared env var"
          else
            echo "  ok No incorrect CF_ACCESS_CLIENT_ID in wrapper"
          fi

          echo ""
          echo "All checks passed."
