name: 'Cloudflare Tunnel SSH Setup'
description: 'Set up SSH via Cloudflare Tunnel with cloudflared - zero-trust DevOps and CI/CD access without exposing port 22'
author: 'NX1X'

branding:
  icon: 'shield'
  color: 'orange'

# =============================================================================
# Inputs
# =============================================================================
inputs:
  cf-access-client-id:
    description: 'Cloudflare Access service token ID (used as TUNNEL_SERVICE_TOKEN_ID)'
    required: true

  cf-access-client-secret:
    description: 'Cloudflare Access service token secret (used as TUNNEL_SERVICE_TOKEN_SECRET)'
    required: true

  ssh-private-key:
    description: 'SSH private key (Ed25519 or RSA) for authenticating to the remote server'
    required: true

  ssh-host:
    description: 'SSH hostname(s) routed through Cloudflare Tunnel. Space or newline-separated. Prefix with user@ to override ssh-user per host (e.g. "web.example.com admin@db.example.com").'
    required: true

  ssh-user:
    description: 'SSH username on the remote server (default for all hosts unless overridden with user@host syntax)'
    required: false
    default: 'deploy'

  cloudflared-version:
    description: 'cloudflared version to install. Use "latest" or a specific tag like "2025.4.0".'
    required: false
    default: 'latest'

  ssh-key-path:
    description: 'Filesystem path where the SSH private key will be written'
    required: false
    default: '~/.ssh/id_ed25519'

  connect-timeout:
    description: 'SSH ConnectTimeout in seconds (cloudflared handshake can take several seconds)'
    required: false
    default: '120'

  server-alive-interval:
    description: 'SSH ServerAliveInterval in seconds (keep-alive ping frequency)'
    required: false
    default: '30'

  test-connection:
    description: 'Run a test SSH command after setup to verify the tunnel is working'
    required: false
    default: 'true'

  known-hosts:
    description: 'Known hosts entries for strict host key checking. If empty, StrictHostKeyChecking is set to "accept-new".'
    required: false
    default: ''

  ssh-extra-config:
    description: 'Additional SSH config directives to add to each Host block (one per line, e.g. "ForwardAgent yes")'
    required: false
    default: ''

  retry-count:
    description: 'Number of SSH connection test attempts before failing (only applies when test-connection is true)'
    required: false
    default: '3'

  retry-delay:
    description: 'Seconds to wait between retry attempts'
    required: false
    default: '5'

# =============================================================================
# Outputs
# =============================================================================
outputs:
  cloudflared-version:
    description: 'Installed cloudflared version string (e.g. "2025.4.0")'
    value: ${{ steps.install-cloudflared.outputs.cloudflared-version }}
  connection-test-result:
    description: 'Connection test result: "success", "failed", or "skipped"'
    value: ${{ steps.test-connection.outputs.connection-test-result || steps.test-connection-skipped.outputs.connection-test-result }}

# =============================================================================
# Composite action steps
# =============================================================================
runs:
  using: 'composite'
  steps:

    # -------------------------------------------------------------------------
    # 1. Install cloudflared
    # -------------------------------------------------------------------------
    - name: Install cloudflared
      id: install-cloudflared
      shell: bash
      env:
        CLOUDFLARED_VERSION: ${{ inputs.cloudflared-version }}
      run: |
        # Validate version format (reject anything that isn't "latest" or a version number)
        if [ "$CLOUDFLARED_VERSION" != "latest" ]; then
          if ! echo "$CLOUDFLARED_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Invalid cloudflared-version '$CLOUDFLARED_VERSION' - expected 'latest' or 'X.Y.Z'"
            exit 1
          fi
        fi

        if [ "$CLOUDFLARED_VERSION" = "latest" ]; then
          DOWNLOAD_URL="https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb"
        else
          DOWNLOAD_URL="https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
        fi
        echo "Downloading cloudflared from: $DOWNLOAD_URL"
        curl -fsSL "$DOWNLOAD_URL" -o /tmp/cloudflared.deb
        sudo dpkg -i /tmp/cloudflared.deb

        # Capture installed version for output
        CF_VERSION_RAW=$(cloudflared --version)
        echo "$CF_VERSION_RAW"
        CF_VERSION=$(echo "$CF_VERSION_RAW" | sed -n 's/.*version \([^ ]*\).*/\1/p')
        echo "cloudflared-version=${CF_VERSION}" >> "$GITHUB_OUTPUT"

    # -------------------------------------------------------------------------
    # 2. Create ~/.ssh directory
    # -------------------------------------------------------------------------
    - name: Create SSH directory
      shell: bash
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

    # -------------------------------------------------------------------------
    # 3. Write known_hosts file (optional)
    # -------------------------------------------------------------------------
    - name: Write known_hosts
      if: inputs.known-hosts != ''
      shell: bash
      env:
        KNOWN_HOSTS_CONTENT: ${{ inputs.known-hosts }}
      run: |
        echo "$KNOWN_HOSTS_CONTENT" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
        echo "Wrote $(wc -l < ~/.ssh/known_hosts) known_hosts entries."

    # -------------------------------------------------------------------------
    # 4. Write SSH private key
    # -------------------------------------------------------------------------
    - name: Write SSH private key
      shell: bash
      env:
        INPUT_SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_KEY_PATH: ${{ inputs.ssh-key-path }}
      run: |
        KEY_PATH="${SSH_KEY_PATH/#\~/$HOME}"
        install -m 600 /dev/null "$KEY_PATH"
        echo "$INPUT_SSH_PRIVATE_KEY" > "$KEY_PATH"

    # -------------------------------------------------------------------------
    # 5. Create cloudflared wrapper script with embedded service token credentials
    #
    # Why a wrapper script instead of environment variables?
    #   SSH spawns ProxyCommand as a subprocess. Environment variables written to
    #   $GITHUB_ENV do not reliably propagate into that subprocess chain. Embedding
    #   credentials at script-write time is the only approach that works reliably.
    #
    # Why TUNNEL_SERVICE_TOKEN_ID / TUNNEL_SERVICE_TOKEN_SECRET?
    #   These are the actual env var names cloudflared reads
    #   (source: cmd/cloudflared/access/cmd.go).
    #   CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET are HTTP *header* names -
    #   despite being widely documented, they are NOT the env vars cloudflared reads.
    #   Using the wrong names causes a silent fallback to browser auth ("A browser
    #   window should have opened"), which fails in CI/CD.
    # -------------------------------------------------------------------------
    - name: Create cloudflared wrapper script
      shell: bash
      env:
        CF_TOKEN_ID: ${{ inputs.cf-access-client-id }}
        CF_TOKEN_SECRET: ${{ inputs.cf-access-client-secret }}
      run: |
        {
          echo '#!/bin/bash'
          printf 'export TUNNEL_SERVICE_TOKEN_ID=%q\n' "$CF_TOKEN_ID"
          printf 'export TUNNEL_SERVICE_TOKEN_SECRET=%q\n' "$CF_TOKEN_SECRET"
          echo 'exec cloudflared access ssh "$@"'
        } > ~/.cloudflared-ssh
        chmod 700 ~/.cloudflared-ssh

    # -------------------------------------------------------------------------
    # 6. Configure SSH to route through the tunnel
    #
    # Supports multiple hosts (space or newline-separated in ssh-host input).
    # Each host gets its own Host block. The user@host syntax overrides the
    # default ssh-user for that specific host.
    # -------------------------------------------------------------------------
    - name: Configure SSH
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_USER: ${{ inputs.ssh-user }}
        CONNECT_TIMEOUT: ${{ inputs.connect-timeout }}
        SERVER_ALIVE_INTERVAL: ${{ inputs.server-alive-interval }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
        SSH_EXTRA_CONFIG: ${{ inputs.ssh-extra-config }}
      run: |
        # Validate numeric inputs
        if ! echo "$CONNECT_TIMEOUT" | grep -qE '^[0-9]+$'; then
          echo "ERROR: connect-timeout must be a non-negative integer, got '$CONNECT_TIMEOUT'"
          exit 1
        fi
        if ! echo "$SERVER_ALIVE_INTERVAL" | grep -qE '^[0-9]+$'; then
          echo "ERROR: server-alive-interval must be a non-negative integer, got '$SERVER_ALIVE_INTERVAL'"
          exit 1
        fi

        if [ -n "$KNOWN_HOSTS" ]; then
          HOST_KEY_CHECK="yes"
        else
          HOST_KEY_CHECK="accept-new"
        fi

        # Parse host entries (space or newline separated)
        HOST_LIST=$(echo "$SSH_HOST" | tr '\n' ' ')

        set -f  # Disable glob expansion for unquoted word splitting
        # shellcheck disable=SC2086
        for entry in $HOST_LIST; do
          # Skip empty entries
          [ -z "$entry" ] && continue

          # Parse user@host or bare host
          if [[ "$entry" == *@* ]]; then
            ENTRY_USER="${entry%%@*}"
            ENTRY_HOST="${entry#*@}"
          else
            ENTRY_USER="$SSH_USER"
            ENTRY_HOST="$entry"
          fi

          echo "Configuring SSH for: ${ENTRY_USER}@${ENTRY_HOST}"

          {
            printf 'Host %s\n' "$ENTRY_HOST"
            printf '  User %s\n' "$ENTRY_USER"
            printf '  StrictHostKeyChecking %s\n' "$HOST_KEY_CHECK"
            printf '  ConnectTimeout %s\n' "$CONNECT_TIMEOUT"
            printf '  ServerAliveInterval %s\n' "$SERVER_ALIVE_INTERVAL"
            printf '  ServerAliveCountMax 4\n'
            printf '  ProxyCommand ~/.cloudflared-ssh --hostname %%h\n'
            # Append custom SSH config directives
            if [ -n "$SSH_EXTRA_CONFIG" ]; then
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                printf '  %s\n' "$line"
              done <<< "$SSH_EXTRA_CONFIG"
            fi
          } >> ~/.ssh/config
        done
        set +f  # Re-enable glob expansion

        chmod 600 ~/.ssh/config

    # -------------------------------------------------------------------------
    # 7. Verify setup (credentials are redacted in output)
    # -------------------------------------------------------------------------
    - name: Verify setup
      shell: bash
      env:
        SSH_KEY_PATH: ${{ inputs.ssh-key-path }}
        SSH_HOST: ${{ inputs.ssh-host }}
      run: |
        KEY_PATH="${SSH_KEY_PATH/#\~/$HOME}"

        echo "=== cloudflared ==="
        cloudflared --version
        echo ""

        echo "=== SSH key ==="
        echo "Path:        $KEY_PATH"
        echo "Lines:       $(wc -l < "$KEY_PATH")"
        echo "Permissions: $(stat -c '%a' "$KEY_PATH")"
        echo "Fingerprint: $(ssh-keygen -l -f "$KEY_PATH")"
        echo ""

        echo "=== Wrapper script (credentials redacted) ==="
        sed 's/=.*/=<REDACTED>/' ~/.cloudflared-ssh
        echo "Token ID present: $(grep -c 'TUNNEL_SERVICE_TOKEN_ID=' ~/.cloudflared-ssh)"
        echo ""

        if [ -f ~/.ssh/known_hosts ]; then
          echo "=== Known hosts ==="
          echo "Entries: $(wc -l < ~/.ssh/known_hosts)"
          echo "StrictHostKeyChecking: yes"
          echo ""
        else
          echo "=== Known hosts ==="
          echo "Not configured (StrictHostKeyChecking: accept-new)"
          echo ""
        fi

        echo "=== SSH config entries ==="
        HOST_LIST=$(echo "$SSH_HOST" | tr '\n' ' ')
        set -f  # Disable glob expansion for unquoted word splitting
        # shellcheck disable=SC2086
        for entry in $HOST_LIST; do
          [ -z "$entry" ] && continue
          if [[ "$entry" == *@* ]]; then
            ENTRY_HOST="${entry#*@}"
          else
            ENTRY_HOST="$entry"
          fi
          echo "--- Host: $ENTRY_HOST ---"
          grep -F -A10 "Host ${ENTRY_HOST}" ~/.ssh/config || echo "(entry not found)"
          echo ""
        done
        set +f

    # -------------------------------------------------------------------------
    # 8. Test SSH connection (optional, with retry logic)
    # -------------------------------------------------------------------------
    - name: Test SSH connection
      id: test-connection
      if: inputs.test-connection == 'true'
      shell: bash
      env:
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_HOST: ${{ inputs.ssh-host }}
        RETRY_COUNT: ${{ inputs.retry-count }}
        RETRY_DELAY: ${{ inputs.retry-delay }}
      run: |
        # Validate retry-count is a positive integer
        if ! echo "$RETRY_COUNT" | grep -qE '^[1-9][0-9]*$'; then
          echo "ERROR: retry-count must be a positive integer, got '$RETRY_COUNT'"
          exit 1
        fi

        # Validate retry-delay is a positive integer
        if ! echo "$RETRY_DELAY" | grep -qE '^[1-9][0-9]*$'; then
          echo "ERROR: retry-delay must be a positive integer, got '$RETRY_DELAY'"
          exit 1
        fi

        HOST_LIST=$(echo "$SSH_HOST" | tr '\n' ' ')
        ALL_PASSED=true

        set -f  # Disable glob expansion for unquoted word splitting
        # shellcheck disable=SC2086
        for entry in $HOST_LIST; do
          [ -z "$entry" ] && continue

          # Parse user@host or bare host
          if [[ "$entry" == *@* ]]; then
            ENTRY_USER="${entry%%@*}"
            ENTRY_HOST="${entry#*@}"
          else
            ENTRY_USER="$SSH_USER"
            ENTRY_HOST="$entry"
          fi

          echo "=== Testing ${ENTRY_USER}@${ENTRY_HOST} ==="
          ATTEMPT=1
          HOST_OK=false
          while [ "$ATTEMPT" -le "$RETRY_COUNT" ]; do
            echo "Attempt ${ATTEMPT}/${RETRY_COUNT}..."
            if ssh -o BatchMode=yes \
              "${ENTRY_USER}@${ENTRY_HOST}" \
              "echo 'cloudflare-tunnel-ssh-action: connection verified'"; then
              echo "Connection to ${ENTRY_HOST} passed on attempt ${ATTEMPT}."
              HOST_OK=true
              break
            fi
            if [ "$ATTEMPT" -lt "$RETRY_COUNT" ]; then
              echo "Attempt ${ATTEMPT} failed. Retrying in ${RETRY_DELAY}s..."
              sleep "$RETRY_DELAY"
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$HOST_OK" = false ]; then
            echo "ERROR: Connection to ${ENTRY_HOST} failed after ${RETRY_COUNT} attempts."
            ALL_PASSED=false
          fi
        done
        set +f

        if [ "$ALL_PASSED" = true ]; then
          echo "All connection tests passed."
          echo "connection-test-result=success" >> "$GITHUB_OUTPUT"
        else
          echo "ERROR: One or more connection tests failed."
          echo "connection-test-result=failed" >> "$GITHUB_OUTPUT"
          exit 1
        fi

    # -------------------------------------------------------------------------
    # 9. Set connection test output when test is skipped
    # -------------------------------------------------------------------------
    - name: Set connection test output (skipped)
      id: test-connection-skipped
      if: inputs.test-connection != 'true'
      shell: bash
      run: |
        echo "connection-test-result=skipped" >> "$GITHUB_OUTPUT"

    # -------------------------------------------------------------------------
    # 10. Write cleanup state file
    #
    # Records paths and hosts so the cleanup sub-action can remove everything
    # without the user needing to pass the same inputs again.
    # -------------------------------------------------------------------------
    - name: Write cleanup state
      shell: bash
      env:
        SSH_KEY_PATH: ${{ inputs.ssh-key-path }}
        SSH_HOST: ${{ inputs.ssh-host }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        KEY_PATH="${SSH_KEY_PATH/#\~/$HOME}"
        {
          echo "KEY_PATH=${KEY_PATH}"
          echo "WRAPPER_PATH=${HOME}/.cloudflared-ssh"
          echo "SSH_HOST=${SSH_HOST}"
          if [ -n "$KNOWN_HOSTS" ]; then
            echo "KNOWN_HOSTS_CREATED=true"
          fi
        } > ~/.cloudflared-ssh-state
        echo "State file written to ~/.cloudflared-ssh-state"
